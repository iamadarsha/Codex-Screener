app = "breakoutscan-api"
primary_region = "sin"

[build]

[env]
  PORT = "8001"

[http_service]
  internal_port = 8001
  force_https = true
  # CRITICAL: never sleep — NSE poller runs continuously every 30s
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.health]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    port = 8001
    timeout = "10s"
    type = "http"
